# ============================================================================
# DUNE LEGACY - QUANTBOT AI CONFIGURATION
# ============================================================================
#
# This file allows you to customize QuantBot AI behavior without recompiling.
# This file is located in the config subdirectory of your game installation:
#
# Config file location:
#   Windows: <game_install_dir>\config\QuantBot Config.ini
#   Linux:   <game_install_dir>/config/QuantBot Config.ini
#   macOS:   Dune Legacy.app/Contents/Resources/config/QuantBot Config.ini
#
# ============================================================================
# DIFFICULTY SETTINGS
# ============================================================================
#
# Each difficulty level has its own settings for attack behavior, military
# limits, and harvester limits. Adjust these to make the AI easier or harder.
#
# AttackEnabled              - Can this difficulty attack at all? (0/1)
# OrnithopterAttackEnabled   - Can ornithopters attack? (0/1)
# OrnithopterAttackThreshold - Minimum ornithopters needed to attack
# MilitaryValueMultiplier    - Campaign: multiplier for initial military value
# MilitaryValueLimitSmallMap - Custom games: military limit for small maps (32x32)
# MilitaryValueLimitMediumMap- Custom games: military limit for medium maps (64x64)
# MilitaryValueLimitLargeMap - Custom games: military limit for large maps (128x128)
# HarvesterLimitMultiplier   - Campaign: harvesters per refinery
# HarvesterLimitSmallMap     - Custom games: harvester limit for small maps
# HarvesterLimitMediumMap    - Custom games: harvester limit for medium maps
# HarvesterLimitLargeMap     - Custom games: harvester limit for large maps

[Difficulty Settings]
# Very Easy (Defend) - Never attacks
Defend_AttackEnabled=0
Defend_OrnithopterAttackEnabled=0
Defend_OrnithopterAttackThreshold=999
Defend_MilitaryValueMultiplier=1.8
Defend_MilitaryValueLimitSmallMap=4000
Defend_MilitaryValueLimitMediumMap=8000
Defend_MilitaryValueLimitLargeMap=12000
Defend_HarvesterLimitMultiplier=2
Defend_HarvesterLimitSmallMap=2
Defend_HarvesterLimitMediumMap=3
Defend_HarvesterLimitLargeMap=4

# Easy - Ground units attack, ornithopters defend only
Easy_AttackEnabled=1
Easy_OrnithopterAttackEnabled=0
Easy_OrnithopterAttackThreshold=999
Easy_MilitaryValueMultiplier=1.0
Easy_MilitaryValueLimitSmallMap=6000
Easy_MilitaryValueLimitMediumMap=12000
Easy_MilitaryValueLimitLargeMap=18000
Easy_HarvesterLimitMultiplier=1
Easy_HarvesterLimitSmallMap=2
Easy_HarvesterLimitMediumMap=3
Easy_HarvesterLimitLargeMap=4

# Medium - Ground units attack, ornithopters defend only  
Medium_AttackEnabled=1
Medium_OrnithopterAttackEnabled=0
Medium_OrnithopterAttackThreshold=999
Medium_MilitaryValueMultiplier=1.5
Medium_MilitaryValueLimitSmallMap=8000
Medium_MilitaryValueLimitMediumMap=16000
Medium_MilitaryValueLimitLargeMap=24000
Medium_HarvesterLimitMultiplier=2
Medium_HarvesterLimitSmallMap=3
Medium_HarvesterLimitMediumMap=4
Medium_HarvesterLimitLargeMap=5

# Hard - Full aggression
Hard_AttackEnabled=1
Hard_OrnithopterAttackEnabled=1
Hard_OrnithopterAttackThreshold=4
Hard_MilitaryValueMultiplier=2.0
Hard_MilitaryValueLimitSmallMap=10000
Hard_MilitaryValueLimitMediumMap=20000
Hard_MilitaryValueLimitLargeMap=30000
Hard_HarvesterLimitMultiplier=2
Hard_HarvesterLimitSmallMap=4
Hard_HarvesterLimitMediumMap=5
Hard_HarvesterLimitLargeMap=6

# Brutal - Maximum aggression
Brutal_AttackEnabled=1
Brutal_OrnithopterAttackEnabled=1
Brutal_OrnithopterAttackThreshold=4
Brutal_MilitaryValueMultiplier=3.0
Brutal_MilitaryValueLimitSmallMap=15000
Brutal_MilitaryValueLimitMediumMap=30000
Brutal_MilitaryValueLimitLargeMap=45000
Brutal_HarvesterLimitMultiplier=3
Brutal_HarvesterLimitSmallMap=5
Brutal_HarvesterLimitMediumMap=6
Brutal_HarvesterLimitLargeMap=8

# ============================================================================
# UNIT COMPOSITION RATIOS
# ============================================================================
#
# These ratios determine what units the AI builds when totalDamage < 3000.
# Each difficulty level can have different ratios for progressive difficulty.
# Values are percentages (0.0 to 1.0) and should sum to approximately 1.0.
#
# Tank        - Regular combat tanks
# SiegeTank   - Siege tanks (heavy artillery)
# Launcher    - Rocket launchers
# Special     - House-specific special units (Sonic Tank, Devastator, Deviator)
# Ornithopter - Flying units
#
# NOTE: Harkonnen cannot build ornithopters (Builder=Invalid in ObjectData.ini)
#       Ordos cannot build launchers (Builder=Invalid in ObjectData.ini)

